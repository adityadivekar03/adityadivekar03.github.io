baseURL = "https://adityadivekar03.github.io/"
languageCode = "en-us"
title = "Aditya Divekar"
theme = "PaperMod"
canonifyURLs = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  env = "production"
  title = "Aditya Divekar"
  description = "Notes on research, implementations, and other pursuits."
  keywords = ["blog", "research", "optimization", "finance", "math"]
  author = "Aditya Divekar"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  disableSpecial1stPost = true
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Homepage: a short tagline above the post cards. No bio, no intro.
  [params.homeInfoParams]
    Title = "Notes on things I wanted to understand better by writing them down"
    Content = ""

  [params.analytics.google]
    SiteVerificationTag = "YFu13QWufrG6Wc29qk_DxsDNQbZLCiPMyk5ZIuoWn5c"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true          # allow raw HTML (needed for some KaTeX/markdown edge cases)
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false        # use CSS classes so we can theme code blocks ourselves
    style = "monokai"
    codeFences = true
    lineNos = false
